<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4e9">
<title>Lapka</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Mulish:wght@400;500&display=swap">
<style>

/* Layout: one phone-width column (like the original iPhone app), centered on desktop; sheets slide over it. */
:root{
  --paper:#f5f4e9;      /* original tableBackgroundColor 0.961 0.957 0.912 */
  --card:#fbfaf3;
  --ink:#151515;
  --muted:#7b7a70;
  --line:#e2e0d2;
  --night:#151515;       /* sensor band */
  --on-night:#f5f4e9;
  --good:#5fc35a; --almost:#e9c13f; --bad:#e2532f;   /* card-filter-pass icons */
  --cyan:#6fd6da;        /* splash art */
  --display:"Jost",-apple-system,"Segoe UI",Roboto,sans-serif;
  --text:"Mulish",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
header.top{display:flex;align-items:center;gap:8px;padding-block:18px 10px}
.wordmark{font-family:var(--display);font-size:30px;letter-spacing:-.8px;line-height:1}
.wordmark small{display:block;font-family:var(--text);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.top .sp{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;padding:0}
.iconbtn svg{width:20px;height:20px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-height:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--good)} .dot.warn{background:var(--almost)} .dot.err{background:var(--bad)}

/* ---- welcome ---- */
.hero{background:var(--night);color:var(--on-night);border-radius:22px;padding:26px 22px 22px;margin-top:8px;display:flex;flex-direction:column;gap:18px}
.hero .devices{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;height:150px}
.hero .devices img{height:100%;width:auto;flex:1 1 0;object-fit:contain;min-width:0}
.hero .devices img:nth-child(2){height:78%} .hero .devices img:nth-child(3){height:62%} .hero .devices img:nth-child(4){height:78%}
.hero h1{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.1;letter-spacing:-.5px;margin:0;text-wrap:balance}
.hero p{margin:0;color:#c9c8bd;font-size:14px}
.pill{border:0;border-radius:999px;padding:13px 22px;background:var(--ink);color:var(--paper);font-family:var(--display);font-size:16px}
.pill.light{background:var(--paper);color:var(--ink)}
.pill.ghost{background:transparent;border:1.5px solid currentColor}
.pill:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.demo-pick{display:flex;gap:8px;flex-wrap:wrap}
.demo-pick button{border:1.5px solid #4a4a46;background:transparent;color:var(--on-night);border-radius:999px;padding:8px 14px;font-size:13px}
.tips{margin-top:14px;display:grid;gap:10px;font-size:13.5px;color:#4a4943}
.tips div{display:flex;gap:10px}
.tips b{font-family:var(--display);font-weight:500;color:var(--ink);flex:0 0 22px}

/* ---- identification ---- */
.ident{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:40px 20px;text-align:center}
.bigbtn{width:150px;height:150px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-family:var(--display);font-size:20px;position:relative;display:grid;place-items:center;transition:transform .15s}
.bigbtn:active{transform:scale(.97)}
.bigbtn svg.ring{position:absolute;inset:-9px;width:168px;height:168px;transform:rotate(-90deg);pointer-events:none}
.bigbtn svg.ring circle{fill:none;stroke-width:3}
.bigbtn .lbl{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.bigbtn .lbl small{font-family:var(--text);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.65;margin-top:6px}
.blink{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
.bits{display:flex;gap:10px;font-family:var(--display);font-size:20px}
.bits span{width:38px;height:44px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.bits span.cur{border-color:var(--ink);color:var(--ink)}
.bits span.v1{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bits span.v0{color:var(--ink);border-color:var(--ink)}
.idnote{font-size:13px;color:var(--muted);max-width:32ch}

/* ---- sensor ---- */
.band{background:var(--night);color:var(--on-night);border-radius:22px;padding:18px 20px;display:flex;gap:16px;align-items:center;margin-top:6px}
.band img{height:86px;width:auto;flex:none}
.band .t{min-width:0;flex:1}
.band h2{margin:0;font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.4px}
.band p{margin:2px 0 0;font-size:12.5px;color:#bdbcb1}
.band .x{background:transparent;border:1.5px solid #55554f;color:var(--on-night);border-radius:999px;padding:6px 12px;font-size:12px;flex:none;align-self:flex-start}
.meter{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:22px 6px;gap:4px;position:relative}
.value{font-family:var(--display);font-size:84px;line-height:.95;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.value.dim{color:#c6c4b6}
.unit{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.sub{display:flex;gap:22px;justify-content:center;margin-top:12px;font-variant-numeric:tabular-nums}
.sub div{display:flex;flex-direction:column;align-items:center}
.sub b{font-family:var(--display);font-weight:500;font-size:22px}
.sub span{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.verdict{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;margin-top:12px}
.verdict img{width:26px;height:26px}
#particles{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:3px;margin-top:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.controls{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:14px 8px}
.hint{font-size:13.5px;color:#4a4943;text-align:center;max-width:34ch;min-height:2.9em}
.after{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.small{padding:9px 16px;font-size:14px}

.filters h3,.sheet h3{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:500;margin:22px 0 10px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;margin-inline:-4px;padding-inline:4px}
.chip{flex:0 0 84px;scroll-snap-align:start;border:1.5px solid transparent;background:var(--card);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;line-height:1.15;text-align:center}
.chip img{width:44px;height:44px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.limit{font-size:13px;color:var(--muted);margin-top:4px}

/* ---- sheets ---- */
.scrim{position:fixed;inset:0;background:rgba(21,21,21,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;z-index:21;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px calc(24px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-family:var(--display);font-weight:500;font-size:22px;margin:4px 0 0}
.field{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.field label{font-size:14px}
.field .help{grid-column:1/-1;font-size:12px;color:var(--muted)}
.field select,.field input[type=number]{font:inherit;font-size:14px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--card);max-width:200px}
.field input[type=range]{accent-color:var(--ink);width:150px}
.diag{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;overflow-x:auto;margin:0}
.log{display:flex;flex-direction:column;gap:8px}
.entry{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.entry img{width:40px;height:40px}
.entry .v{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.entry .m{font-size:12px;color:var(--muted)}
.entry .pass{width:22px;height:22px;vertical-align:-5px}
.empty{color:var(--muted);font-size:14px;padding-block:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.blink{animation:none}.bigbtn{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="wordmark">lapka<small>personal environment monitor</small></div>
    <div class="sp"></div>
    <button class="iconbtn" id="btnLog" aria-label="Журнал измерений" title="Журнал"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg></button>
    <button class="iconbtn" id="btnSettings" aria-label="Настройки и диагностика" title="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg></button>
  </header>
  <div class="status" id="status"><span class="dot"></span><span>Микрофон выключен</span></div>
  <main id="view"></main>
</div>
<div id="layer"></div>

  if (s && s.type === T.Humidity && s.calibratingLevel) lines.push(`Влажность: U1 ${s.calibratingLevel.toFixed(4)}, U4 ${(s.secondCalibratingLevel || 0).toFixed(4)}, K ${[s.K1, s.K2, s.K3, s.K4, s.K5].join(' ')}`);
  if (s && s.type === T.Nitrates && s.calibration_level) lines.push(`Нитраты: U2 ${s.calibration_level.toFixed(4)}, T ${s.temperature.toFixed(1)} °C, фон ${s.empty_nitrates.toFixed(1)}, K ${[s.K1, s.K2, s.K3, s.K4].join(' ')}`);
  if (s && s.type === T.Fields) lines.push(`ЭМП: scaleCoef ${s.scaleCoef}, режим ${s.fieldType ? 'ВЧ' : 'НЧ'}`);
  return lines.join('\n');
}
/* manual mode: drive the output directly (L/R bits) to look at raw responses */
function openLab() {
  if (!S.io) { toast('Сначала нажмите «Начать» на главном экране'); return; }
  S.mgr.removeSensor(); S.mode = 'idle'; render();
  const sp = new SignalProcessor(S.io); sp.fftAnalyzer.meanSteps = 10; sp.leftAmplitude = 0; sp.rightAmplitude = 0; sp.start();
  S.labSp = sp;
  $('lab').innerHTML = `<h3>Ручной режим</h3>
    <div class="field"><label for="lF">Частота</label><select id="lF"><option>16000</option><option selected>18000</option><option>19000</option></select></div>
    <div class="field"><label>Левый канал</label><div class="seg" id="lL"><button data-v="0" aria-pressed="true">0</button><button data-v="0.2" aria-pressed="false">0.2</button><button data-v="1" aria-pressed="false">1</button></div></div>
    <div class="field"><label>Правый канал</label><div class="seg" id="lR"><button data-v="0" aria-pressed="true">0</button><button data-v="1" aria-pressed="false">1</button></div></div>
    <div class="help" style="font-size:12px;color:var(--muted);margin-top:8px">Амплитуда отклика видна в диагностике выше. Закройте окно, чтобы вернуться к определению датчика.</div>`;
  $('lF').onchange = e => sp.setFrequency(sp.optimizeFrequency(+e.target.value));
  const seg = (id, set) => $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); set(+b.dataset.v); });
  seg('lL', v => sp.setLeftAmplitude(v)); seg('lR', v => sp.setRightAmplitude(v));
}

function sheet(html) {
  $('layer').innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}
    <div class="row" style="margin-top:18px"><button class="pill small" id="btnClose">Закрыть</button></div></div>`;
  $('scrim').onclick = closeSheet; $('btnClose').onclick = closeSheet;
}
function closeSheet() {
  $('layer').innerHTML = '';
  if (S.labSp) { S.labSp.stop(); S.labSp = null; if (S.io) identify(); }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ================= bindings ================= */
function bind() {
  const q = id => $(id);
  if (q('btnStart')) q('btnStart').onclick = () => startAudio();
  document.querySelectorAll('[data-demo]').forEach(b => b.onclick = () => startAudio(b.dataset.demo));
  if (q('btnIdent')) q('btnIdent').onclick = identify;
  if (q('btnReident')) q('btnReident').onclick = identify;
  if (q('btnSense')) q('btnSense').onclick = onSense;
  document.querySelectorAll('[data-ft]').forEach(b => b.onclick = () => switchField(+b.dataset.ft));
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
    S.filter[S.type] = b.dataset.filter; store.set('filters', S.filter);
    document.querySelectorAll('[data-filter]').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('limit').textContent = limitText(); renderValue();
  });
  renderBits();
}
$('btnLog').onclick = openLog;
$('btnSettings').onclick = openSettings;
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener)
  navigator.mediaDevices.addEventListener('devicechange', () => { if (S.io && S.io.mode !== 'sim' && S.mode !== 'identifying') toast('Аудиоустройства изменились. Нажмите «Другой датчик», чтобы определить заново.'); });
setInterval(setStatus, 500);
render(); setStatus();

</script>
